[workspace]
resolver = "3"
exclude = ["plugins/sample-column"]
members = [
    ".",
    "crates/tsubame-core",
    "crates/tsubame-win",
    "crates/tsubame-ui",
    "crates/tsubame-d2d",
    "crates/tsubame-ext-api",
    "crates/tsubame-plughost",
    "crates/tsubame-bench",
    "crates/tsubame-update",
    "crates/tsubame-config",
    "crates/tsubame-handler",
]
default-members = ["."]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tsubame-core = { path = "crates/tsubame-core" }
tsubame-win = { path = "crates/tsubame-win" }
tsubame-ui = { path = "crates/tsubame-ui" }
tsubame-d2d = { path = "crates/tsubame-d2d" }
tsubame-ext-api = { path = "crates/tsubame-ext-api" }
tsubame-update = { path = "crates/tsubame-update" }
tsubame-config = { path = "crates/tsubame-config" }
tsubame-handler = { path = "crates/tsubame-handler" }
windows = "0.61"
# TOML for the config and session files. Default features are exactly what is
# needed (std, serde, parse, display); no `preserve_order`/`fast_hash`/`debug`.
serde = { version = "1", features = ["derive"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse", "display"] }

[package]
name = "tsubame"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# counting global allocator for the TSUBAME_MEMDIAG report (src/memdiag.rs)
memdiag = []

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
tsubame-config.workspace = true
tsubame-core.workspace = true
tsubame-d2d.workspace = true
tsubame-ui.workspace = true
tsubame-update.workspace = true
tsubame-win.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
