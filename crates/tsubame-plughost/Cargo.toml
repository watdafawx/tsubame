[package]
name = "tsubame-plughost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsubame wasm plugin host: WIT interface, capability manifest, IPC protocol, supervisor client and the host exe"

[lib]
path = "src/lib.rs"

# The host exe. Runtime only: no Cranelift, it loads `.cwasm` files written by `tsubame-plugc`.
[[bin]]
name = "tsubame-plughost"
path = "src/main.rs"
required-features = ["host"]

# Measurement client and mock hosts for the tests. Not shipped.
[[bin]]
name = "plughost-bench"
path = "src/bin/plughost-bench.rs"

# The tests that drive the real host exe.
[[test]]
name = "host"
required-features = ["host"]

# The sample plugins in `plugins/`, built with the guest SDK, run in the real host exe.
[[test]]
name = "samples"
required-features = ["host"]

[features]
default = ["host"]
# Wasmtime runtime. Off (`default-features = false`) the crate is the manifest,
# the protocol and the supervisor client only, which is what the app links.
# There is no compiler feature: Cranelift lives in the `tsubame-plugc` crate, so no
# feature of this package can put it into `tsubame-plughost.exe` (security review PH-20).
host = ["dep:wasmtime", "dep:windows-sys"]

[dependencies]
tsubame-ext-api.workspace = true
serde.workspace = true
toml.workspace = true
# Smallest set that works: component model + runtime, no cache/profiling/wat/gc/async/threads/parallel-compilation.
wasmtime = { version = "=50.0.2", optional = true, default-features = false, features = ["runtime", "component-model", "std"] }

# Handle-based file access in the host (`src/host/fsopen.rs`). Already in the graph through wasmtime.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
] }

[dev-dependencies]
# The tests compile their guests with the install step's `compile` (which links Cranelift).
# Dev-only: `cargo build -p tsubame-plughost` does not get it. A command that builds test
# targets does, and then also writes a Cranelift-sized exe to `target/<profile>/tsubame-plughost.exe`;
# `tools/release.ps1` refuses such an exe (PH-20).
tsubame-plugc = { path = "../tsubame-plugc" }
# The test guest is WebAssembly text; wit-component turns it into a component against
# the real WIT file. All three are the wasm-tools release wasmtime 50 already uses.
wat = "=1.261.0"
wit-component = "0.261"
wit-parser = "0.261"

# The Windows launcher (`client::JobLauncher`): job object, token elevation check.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]
