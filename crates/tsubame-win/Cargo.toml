[package]
name = "tsubame-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tsubame-core.workspace = true
tsubame-handler.workspace = true
tsubame-config.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies.windows]
workspace = true
features = ["Win32_System_Com", "Win32_System_Diagnostics_ToolHelp"]

# The `implement` macro for COM sinks (IFileOperationProgressSink) emits `::windows_core` paths.
[dependencies.windows-core]
version = "0.61"
