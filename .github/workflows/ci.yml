name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: cargo check
        shell: pwsh
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        shell: pwsh
        run: cargo test --workspace --locked

      - name: cargo clippy (updater, warnings are errors)
        shell: pwsh
        run: cargo clippy -p tsubame-update --all-targets --locked -- -D warnings

      - name: cargo clippy (workspace, warnings are errors)
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Updater maintainer tools still build
        shell: pwsh
        run: cargo check -p tsubame-update --features release-tool,test-server --all-targets --locked
