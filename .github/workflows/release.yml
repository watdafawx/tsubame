name: release

# Push a tag like v0.1.0 (it must equal the version in Cargo.toml) and this builds the release,
# signs the update manifest and publishes the GitHub Release. See docs/release.md.
on:
  push:
    tags: ["v*"]

# The release job needs to create the release and upload assets. Nothing else.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Tag must match the workspace version
        shell: pwsh
        run: |
          $toml = Get-Content -Raw Cargo.toml
          if ($toml -notmatch '(?ms)^\[workspace\.package\]\s*(?:[^\[]*?)^version\s*=\s*"(?<v>[^"]+)"') { throw 'no workspace version in Cargo.toml' }
          $want = "v$($Matches['v'])"
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version ($want)" }
          "VERSION=$($Matches['v'])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Tests
        shell: pwsh
        run: cargo test -p tsubame-update --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup not available' }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build, package, sign the manifest
        shell: pwsh
        env:
          # The ed25519 private key (64 hex chars). Repository secret, see docs/release.md.
          # It is only visible to this step and is never echoed: the release script hands the
          # variable NAME to tools, not the value.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # Optional Authenticode (Azure Artifact Signing / SignPath-style cert in the runner store).
          SIGN_CERT_THUMBPRINT: ${{ secrets.SIGN_CERT_THUMBPRINT }}
          ARTIFACT_SIGNING_DLIB: ${{ secrets.ARTIFACT_SIGNING_DLIB }}
          ARTIFACT_SIGNING_METADATA: ${{ secrets.ARTIFACT_SIGNING_METADATA }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) { throw 'secret UPDATE_SIGNING_KEY is not set (see docs/release.md)' }
          pwsh -NoProfile -File tools/release.ps1 -OutDir "$env:GITHUB_WORKSPACE/dist/release"

      - name: Keep the files as a workflow artifact too
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ env.VERSION }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --title "Tsubame $env:VERSION" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
