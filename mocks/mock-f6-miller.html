      { t: 'What this view is', li: ['View mode <b>Miller</b> next to Details and Grid (toolbar button, dot marks the new modes). Built-in extension <code>tsubame.ext.miller</code>, switchable; off removes the button and the command <code>view.miller</code>.', 'One column per folder level. Selecting a folder adds its children as the next column; selecting a file shows an info column (preview when <code>tsubame.ext.preview</code> is on, metadata only otherwise).', 'Columns are views onto the <b>same entry store</b> as Details: no copy of names, only a 24-byte record index per column. Sort and filter are shared with the pane.'] },
      { t: 'Layout tokens', html: tokenRows },
      { t: 'Overflow and tiny windows', li: ['Deeper than the window: columns scroll horizontally and the view auto-scrolls so the active column stays visible. A 24 px cue on the left shows <b>how many columns are hidden</b> (click = scroll one column left).', 'Window &lt; 560 px: <b>single-column drill-down</b>. One column fills the pane, a 28 px header shows the parent name and a back chevron; <code>Backspace</code> goes up. A selected file fills the pane with the info page.', 'Dual pane: each pane has its own view mode; a pane narrower than 560 px uses single-column mode.', 'More than 12 columns deep: the leftmost collapse into the cue (cap on live columns: 12).'] },
      { t: 'Accessibility', li: ['Keyboard-complete (legend above); focus ring 1 px <code>--c-focus</code> (dark 8.5:1, light 7.0:1 on the row fill).', 'Selected-path state is not colour-only: it carries the 2 px bar and, in the info column, the full path text.', 'UI Automation (built only while a client listens, see <code>docs/ctxmenu.md</code> CM10): each column is a List, rows are ListItems with ExpandCollapse (folders) and SelectionItem; the info column is a Group named after the file.', 'Text contrast: dim text on panel 7.9:1 (dark) and 5.8:1 (light) at 11 px; header counts use the same tokens as Details headers.', 'Moving focus announces "Name, folder, 12 items, column 3 of 4".'] },
      { t: 'Budgets and cost', li: ['<b>Zero idle cost:</b> no timers; the only repaint triggers are input and worker batches. The loading skeleton is static (no animation).', '<b>Memory cap:</b> at most 12 live columns, each holding only a sorted index (<code>Vec&lt;u32&gt;</code>) into the shared store; closing a column drops it. Folders not in the path are never enumerated (no look-ahead, no background work).', 'Loading column uses the normal enumerator with the generation counter; stale batches drop. Skeleton appears after 80 ms, same rule as preview.', 'Column widths are session state (config persists the default only).'] }
    ]) +
    F.oq([
      { q: 'Column header: show a 24 px header (folder name, count) on every column, or none?', rec: 'show it. It names the column when columns scroll off-screen and is where the active column draws its accent rule. Costs 24 px of height.', alt: 'no header, name only in the breadcrumb (saves 24 px, harder to orient at depth).' },
      { q: 'Sort and filter: one pane-wide sort (same as Details), or sort per column?', rec: 'pane-wide, same as Details. Per-column sort needs per-column state and a header menu for little value.', alt: 'per-column sort via header click.' },
      { q: 'Window narrower than 560 px: single-column drill-down, or keep scrolling columns with a minimum width?', rec: 'single-column drill-down below 560 px; horizontal scrolling above. Two 140 px columns plus info are unreadable in a tiny window.', alt: 'always scroll, min column width 140 px.' },
      { q: 'Key bindings: <code>Enter</code> on a folder enters it, on a file opens it. Is <code>→</code> into the info column (focus) or a no-op on files?', rec: '<code>→</code> on a file does nothing (no hidden focus target); <code>Enter</code> opens it. Same as Details. View switch key proposal <code>Ctrl+Alt+3</code> (Details 1, Grid 2, Miller 3, Tree 4); no chord confirmed free, so it needs the keybinding pass noted in <code>docs/PLAN.md</code> section 9.', alt: '<code>→</code> focuses the info column so <code>Tab</code> reaches its buttons.' }
    ]) + '</div>';

  function spec(label, inner) { return '<div class="specimen"><div class="win" data-density="compact" style="height:260px;background:transparent;display:block;position:relative">' + inner + '</div></div>'.replace('</div></div>', '</div><div class="lab">' + label + '</div></div>'); }
  function mini(node, sel, act) { return colHtml(0, node, sel, act).replace('style="width:220px"', 'style="width:100%;height:238px;border-right:0"'); }
  function drawSpecimens() {
    var mk = function (label, html) { return '<div class="specimen"><div class="win" style="height:238px;display:block">' + html + '</div><div class="lab">' + label + '</div></div>'; };
    var src = nodeAt(['Projects', 'harbor-web', 'src']), comps = nodeAt(['Projects', 'harbor-web', 'src', 'components']);
    var g = document.getElementById('spgrid');
    g.innerHTML = mk('Earlier column: path row (quiet fill + bar)', mini(src, 'components', false)) + mk('Active column: selected + focus ring', mini(comps, 'Button.tsx', true)) +
      mk('Loading (skeleton after 80 ms, Esc cancels)', mini({ n: 'node_modules', k: [], mode: 'loading' }, null, true)) + mk('Empty folder', mini({ n: 'tmp', k: [], mode: 'empty' }, null, true)) +
      mk('Access denied (Retry)', mini({ n: 'private', k: [], mode: 'err' }, null, true)) + mk('Junction / symlink badge on rows', mini(nodeAt(['Projects']), 'shared-assets', false));
    F.apply();
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-w]'); if (b) { W = +b.dataset.w; [].forEach.call(document.querySelectorAll('[data-w]'), function (x) { x.classList.toggle('on', x === b); }); render(); } });
  F.onChange(function (k) { if (k === 'state') { path = (PRESET[F.st.state] || PRESET['default']).slice(); msg = ''; render(); } else if (k === 'theme' || k === 'density' || k === 'zebra') { /* CSS only */ } });
  render(); drawSpecimens();
  if (F.st.only) { document.body.classList.add('only'); }
})();
</script>
