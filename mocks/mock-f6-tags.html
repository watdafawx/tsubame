    '<div class="win-frame" style="max-width:1280px"><div id="stage"></div></div>' +
    '<div class="sect"><h2>Tag colours in both themes</h2><p class="cap">Eight colours, one token each per theme (<code>--tg-red</code> &hellip; <code>--tg-gray</code>), picked so every colour is at least 3:1 against every surface a dot or chip border can sit on. Chip labels use <code>--c-text</code>, so label contrast is the normal text contrast; the colour only draws the dot and the chip border. Colour is never the only cue: every tag also has a shape (and a name in the Tag column, picker and sidebar). Computed from the hex values below, in this page:</p><div id="pal"></div></div>' +
    F.notes([
      { t: 'Where tags show', li: ['<b>Details:</b> up to 3 shapes after the name (<code>+N</code> beyond), plus an optional <b>Tags</b> column (<code>tsubame.column.tags</code>, batched: N paths in, N tag-id lists out) with up to 2 chips and <code>+N</code>.', '<b>Grid:</b> shape row under the name (up to 4, <code>+N</code>).', '<b>Sidebar:</b> a Tags section (26 px header, rows fixed 24 px like every sidebar row) with counts. Click filters; click again clears. Dropping files on a tag applies it.', '<b>Filter result:</b> a virtual list of tagged items from every folder (columns Name, Location, Modified), path-bar chip with an x to clear.', '<b>Picker</b> (<code>Alt+T</code>, also Tags &gt; in the context menu): own-drawn popup like the context menu; checkboxes with a mixed state when a multi-selection differs; number keys 1 to 8 toggle; type to find or create.'] },
      { t: 'Where tags are stored', wide: true, html: '<p>Recommendation: <b>central database</b> <code>tags.db</code> next to <code>config.toml</code>, keyed by (volume serial, file id) with the last known path as a hint. The enumerator already reads the 128-bit file id (<code>FileIdExtdDirectoryInformation</code>), so the key costs nothing.</p>' +
        '<table><tr><th></th><th>Sidecar file per folder</th><th>NTFS alternate data stream</th><th>Central database (recommended)</th></tr>' +
        '<tr><td><b>Survives rename / move</b></td><td>No: the sidecar must be rewritten by Tsubame; breaks for moves in other tools</td><td>Yes, on NTFS (stream travels with the file)</td><td>Yes inside one volume (file id); moves across volumes re-key if done by Tsubame, otherwise orphaned</td></tr>' +
        '<tr><td><b>Writes into user folders</b></td><td>Yes: clutter, git noise, fails on read-only media</td><td>Yes, to the file itself (changes mtime on some paths, trips AV, OneDrive and backup tools)</td><td>No: nothing is written next to user files</td></tr>' +
        '<tr><td><b>Works on FAT/exFAT, network, zip, cloud</b></td><td>Only if writable</td><td>No: lost on FAT, SMB without streams, email, zip, cloud sync</td><td>Local NTFS/ReFS by file id; elsewhere path-keyed fallback (weaker)</td></tr>' +
        '<tr><td><b>Listing cost</b></td><td>1 extra file read per folder</td><td>1 extra open per file: too slow to read for visible rows at scale</td><td>One batched lookup per visible page; no disk touch while listing (core rule 1)</td></tr>' +
        '<tr><td><b>Portable to another PC</b></td><td>Yes (copy folder)</td><td>Only to NTFS</td><td>No: export / import in Settings</td></tr>' +
        '<tr><td><b>Cross-folder queries</b> (sidebar filter)</td><td>Needs a scan of every folder</td><td>Needs a scan of every file</td><td>Native: one index lookup</td></tr></table>' +
        '<p>Rejected: writing <code>System.Keywords</code> through the property store (Explorer-compatible tags). It rewrites the file for many types and silently fails for most. Possible later as a one-way export. Unreadable store: Tsubame runs read-only with the banner shown in the Store read-only state; it never loses tags silently and keeps a <code>tags.db.bak</code> from the last clean exit.</p>' },
      { t: 'Accessibility', li: ['Contrast table above: every tag colour &ge; 3:1 on all six surfaces in both themes (dark min 4.3, light min 3.3). The palette is <b>not</b> colour-blind safe on its own (simulated deuteranopia / protanopia leaves pairs such as blue/purple and orange/yellow close), which is why each tag carries a shape and a name.', 'Keyboard: complete (<code>Alt+T</code>, arrows, Space, number keys, Enter, Esc). Picker focus ring 1 px <code>--c-focus</code>.', 'UI Automation (listener-gated, see <code>docs/ctxmenu.md</code> CM10): row Name carries the tags, e.g. &ldquo;contract-draft-v3.docx, tags: Urgent, To review, Work&rdquo;; picker rows expose Toggle (on / off / indeterminate).', 'Selected rows: shapes stay visible (selected fill checked in the table).'] },
      { t: 'Budgets and cost', li: ['<b>Zero idle cost:</b> no timers. The reconcile status is a progress line, redrawn only on worker messages; it pauses while scrolling.', '<b>Background work (the only kind in F6 besides lazy enumeration):</b> (1) tag lookups for visible rows on a worker, batched, generation-checked; (2) after a rename or move event from the watcher, re-key the entry; (3) a one-time lazy reconcile per volume when the volume serial changes. No full-disk scans.', '<b>Memory caps:</b> in-process cache holds at most 4,096 file-id-to-tags rows (LRU, evicts on tab close); database soft cap 100,000 tagged items / 16 MB, a warning row appears at 90%.', 'Writes coalesced; the store is opened only when the tags extension is enabled and first needed.'] }
    ]) +

      { q: 'Storage: central database keyed by file id (recommended above), or NTFS streams so tags travel with files?', rec: 'central <code>tags.db</code>; sidecar files never. An opt-in ADS mirror can follow later without changing the model.', alt: 'ADS as primary (no database to manage, but invisible-to-the-user loss on FAT, cloud and zip).' },
      { q: 'Default tag set and count: 8 named colours (Urgent, Waiting, To review, Done, Work, Personal, Invoice, Archive) or 7 unnamed colour labels like Finder?', rec: '8 colours, shipped with the names above, fully renamable and deletable; users can add custom tags that reuse a colour (shape then repeats).', alt: 'unnamed colour labels only.' },
      { q: 'Shapes on by default? (Eight shapes cost nothing, but dots look calmer.)', rec: 'shapes ON by default (colour-blind users cannot tell some pairs apart); one switch in Settings &gt; Tags for plain dots.', alt: 'dots default, shapes opt-in.' },
      { q: 'Picker chord: <code>Alt+T</code> proposed. No chord is confirmed free (see the keybinding pass noted in <code>docs/PLAN.md</code> section 9).', rec: '<code>Alt+T</code> for the picker, palette command <code>tags.pick</code>, number keys only inside the picker. Plain letter keys stay type-ahead.', alt: 'palette and context menu only, no default key.' }
