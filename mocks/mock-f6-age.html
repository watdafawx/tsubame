      { q: 'Default style and palette: date text with Heat, or chip / accent bar, or an accessible palette first?', rec: 'date text + Heat. Cheapest paint, works with zebra and selection; Colour-blind safe is the first suggestion in the card, and the legend always shows pips for the accessible palettes.', alt: 'start new installs on Colour-blind safe (loses a little speed of scanning for everyone else).' },
      { q: 'Thresholds and meaning of &ldquo;today&rdquo;: calendar day with 7 / 30 / 365 days, configurable?', rec: 'yes: since midnight, 7 / 30 / 365 days, each editable (<code>file_age.week_days</code>, <code>month_days</code>, <code>year_days</code>), plus a Last-24-h option for night owls. Rolling windows are simpler to explain than calendar weeks and months.', alt: 'calendar week and month (Monday start, first of month): more intuitive, locale-dependent, more code.' },
      { q: 'Tint folders by their newest content?', rec: 'no in v1. Folder dates stay their own mtime and tinting folders is off by default. &ldquo;Newest inside&rdquo; needs a background walk; if wanted later it should reuse the <code>tsubame.ext.folder_sizes</code> cache and its caps.', alt: 'newest-file-inside for folders now (accurate, but a walk per visible folder).' }
    ]) + '</div>';
  render();
  if (F.st.only) document.body.classList.add('only');
})();
