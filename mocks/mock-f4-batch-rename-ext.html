    var status = '<span class="em">6 items</span><span class="v"></span><span>3 selected</span>' + (on ? '' : '<span class="v"></span><span class="em">Batch rename is switched off (Settings &gt; Extensions). Renaming one item.</span>');
    var main = '<div style="position:absolute;inset:0;display:flex;flex-direction:column">' + bar + '<div style="position:relative;flex:1;min-height:0"><div class="colhead"><div class="ch c-name" style="flex:1">Name</div><div class="ch c-date">Modified</div><div class="ch c-size r">Size</div></div><div class="rows" style="position:absolute;left:0;top:var(--height-column-header);bottom:0;right:var(--layout-scrollbar-width)">' + rows + '</div>' + pop + (on ? '' : '<div class="pop" style="position:absolute;left:12px;top:' + 'calc(var(--height-column-header) + var(--row-h) * 3 + 4px)' + ';padding:4px 8px;display:flex;align-items:center;gap:8px">' + ic('doc', 14) + '<span class="v" style="color:var(--c-text)">IMG_2043</span><span class="dim">.jpg</span></div>') + '</div></div>';
    return F.win({ id: id, view: 'details', crumbs: ['Data (D:)', 'Photos', '2026'], main: main, status: status, h: 400, side: false, filter: 'Filter' });
  }
  function ext(on, id, title, sub, tag, dis) { return '<div class="extrow"><div class="tx"><b>' + title + ' <span class="tag">' + tag + '</span></b><span>' + sub + ' <code>' + id + '</code></span></div><span class="tgl' + (on ? ' on' : '') + (dis ? ' dis' : '') + '" data-ext="' + id + '"></span></div>'; }
  var on = true;
  function render() {
    on = F.st.state !== 'off';
    document.getElementById('winL').innerHTML = listWin(on, 'win');
    document.getElementById('extcard').innerHTML = '<div class="setcard">' +
      ext(true, 'tsubame.core', 'Core', 'Listing, navigation, tabs, panes, file operations. Cannot be switched off.', 'built-in &middot; required', true) +
      ext(true, 'tsubame.ext.preview', 'Preview pane and Quick Look', 'Docked preview, Space for Quick Look.', 'built-in', false) +
      ext(on, 'tsubame.ext.batch_rename', 'Batch rename', 'F2 on several items: pattern bar with live old to new preview, one undo step. Adds the Rename N items entry to the context menu and the palette.', 'built-in &middot; new in this release', false) +
      ext(true, 'tsubame.ext.folder_sizes', 'Folder sizes', 'Background-calculated size column.', 'built-in', false) + '</div>';
    F.apply();
  }
  document.addEventListener('click', function (e) { var t = e.target.closest('[data-ext="tsubame.ext.batch_rename"]'); if (t) { F.set('state', on ? 'off' : 'on'); } });
  F.onChange(function (k) { if (k === 'state') render(); });
  document.getElementById('root').innerHTML =
    F.bar('P4.F4 Batch rename on ext-api', 'note + settings mock &middot; no visible change when on', STATES) +
    '<div class="page">' +
    '<div class="sect" style="margin-top:0"><h2>What changes for users</h2><p class="cap"><b>Nothing you can see.</b> Batch rename stays exactly as in U3 (<code>mocks/mock-rename.html</code>): select two or more items, press <code>F2</code>, type a pattern, read the live old &rarr; new preview, <code>Apply</code> is one undo step. The only difference is that it is now a built-in extension, <code>tsubame.ext.batch_rename</code>, with a switch in <b>Settings &gt; Extensions</b>. Default: on.</p>' +
    '<table class="cmp"><tr><th></th><th>Before (core only)</th><th>After (built-in extension)</th></tr>' +
    '<tr><td><b>F2 with 2+ items</b></td><td>Opens the batch bar</td><td>Same, while the extension is on</td></tr>' +
    '<tr><td><b>Context menu / palette</b></td><td>&ldquo;Rename&rdquo; (batch behaviour hidden in the same command)</td><td>Also a named entry, &ldquo;Rename N items&hellip;&rdquo;, and palette command <code>file.batch_rename</code>; both vanish when off</td></tr>' +
    '<tr><td><b>Switched off</b></td><td>Not possible</td><td>F2 renames only the focused item inline; the status bar says why. Nothing else changes</td></tr>' +
    '<tr><td><b>Config</b></td><td>none</td><td><code>[extensions] disabled = ["tsubame.ext.batch_rename"]</code> (same list as every extension, <code>docs/config.md</code>)</td></tr>' +
    '<tr><td><b>Pattern engine</b></td><td>core module (<code>src/rename.rs</code>, pure)</td><td>stays core and pure, so tier-1 packs and wasm plugins can reuse it later. The extension registers the command, the menu entry and the bar</td></tr>' +
    '<tr><td><b>Undo, conflicts, journal</b></td><td>core queue</td><td>unchanged (shared with all renames and replaces)</td></tr></table></div>' +
    '<div class="sect"><h2>Settings toggle and the off state</h2><p class="cap">Toggle the extension in the card (or use the State pills). Left: Settings &gt; Extensions row. Right: the same window with three photos selected and <code>F2</code> pressed.</p>' +
    '<div class="cols2"><div><div class="state-lab"><b>Settings &gt; Extensions</b></div><div id="extcard"></div></div><div><div class="state-lab"><b>F2 with 3 items selected</b></div><div class="win-frame" id="winL"></div></div></div></div>' +
    F.notes([
      { t: 'Wiring', li: ['New <code>tsubame.ext.batch_rename</code> in <code>src/ext.rs</code>: contributes command <code>file.batch_rename</code> (keeps number and <code>F2</code> binding semantics), one context-menu item, and a hook for the bar widget in <code>src/batchui.rs</code>.', '<code>file.rename</code> keeps its name and key; with the extension on and 2+ items selected it delegates to batch rename (no change for the key map). Off: delegates to inline rename of the focused row.', 'Registry rules apply (<code>docs/extensions.md</code>): clash on names rejects the extension, disabled items stay reserved so switching back on cannot fail, <code>generation()</code> bump rebuilds the key map.'] },
      { t: 'Accessibility', li: ['No visual or keyboard change when on. The off-state message is plain status-bar text (read by the status bar UIA element), not colour.', 'Toggle in settings is the existing switch widget: keyboard Space, 34 &times; 18 px, name from the row title.', 'Contrast: toggle track and thumb are the existing U4 tokens; inline-rename field uses <code>--c-focus</code> ring (dark 8.5:1, light 7.0:1 on the row fill).'] },
      { t: 'Budgets and cost', li: ['<b>Zero idle cost</b> and zero background work; the extension adds one command and one menu item to the registry (a few hundred bytes).', 'Memory: the pattern bar and preview exist only while a batch rename is open; nothing is retained afterwards. The preview popup shows the first 8 rows and counts the rest, as in U3.', 'Leak gate unchanged; no new caches.'] }
    ]) +
    F.oq([
      { q: 'With the extension off, what should F2 do on a multi-selection?', rec: 'rename the focused item inline and say so in the status bar. Doing nothing feels broken.', alt: 'disable F2 on multi-selection and show a hint in the status bar.' },
      { q: 'Should the extension be switchable at all, or marked <code>required</code> like core?', rec: 'switchable (that is the point of P4: every feature switchable and proof the API is enough); default on, no first-run prompt.', alt: 'required, so rename never disappears by accident.' },
      { q: 'Keep the pattern engine in core, or move it into the extension?', rec: 'keep in core (pure, tested, reusable by packs and wasm). Moving it adds nothing for users and makes the extension harder to switch off cleanly.', alt: 'move all of it into the extension crate.' }
    ]) + '</div>';
  render();
  if (F.st.only) document.body.classList.add('only');
})();
</script>
