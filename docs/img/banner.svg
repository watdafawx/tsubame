<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Tsubame: a very fast file browser for Windows">
  <!--
    README banner. Editable source; the README uses banner.png, rendered from this file
    with a headless browser (GitHub does not load custom web fonts in SVG images).
    The logo group is res/tsubame.svg, copied unchanged and placed with a transform.
    Brand: navy #16233f, cream #f3ecdf, red #e0492c.
  -->
  <rect width="1280" height="320" fill="#16233f"/>

  <!-- faint kanji watermark -->
  <text x="1236" y="286" text-anchor="end" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Segoe UI',sans-serif" font-weight="700" font-size="300" fill="#f3ecdf" fill-opacity="0.06">燕</text>

  <!-- logo: res/tsubame.svg, 100x100 scaled to 200x200 -->
  <g transform="translate(96 60) scale(2)">
    <rect width="100" height="100" rx="22" fill="#16233f"/>
    <g transform="translate(13 13) scale(.74)">
      <g transform="rotate(40 50 53) translate(4 5) scale(.92)">
        <path fill="#f3ecdf" d="M50 10C55.5 10 59 15 59 23C73 25 88 36 96 56C84 45 71 42 60 43C60 58 63 78 70 97C61 86 54 75 50 64C46 75 39 86 30 97C37 78 40 58 40 43C29 42 16 45 4 56C12 36 27 25 41 23C41 15 44.5 10 50 10Z"/>
        <circle cx="50" cy="20" r="4.5" fill="#e0492c"/>
      </g>
    </g>
  </g>
  <rect x="96" y="60" width="200" height="200" rx="44" fill="none" stroke="#f3ecdf" stroke-opacity="0.18" stroke-width="2"/>

  <!-- wordmark -->
  <text x="352" y="172" font-family="'Segoe UI Variable Display','Segoe UI Semibold','Segoe UI',sans-serif" font-weight="600" font-size="96" letter-spacing="-1" fill="#f3ecdf">Tsubame</text>
  <text x="742" y="172" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Segoe UI',sans-serif" font-weight="700" font-size="84" fill="#e0492c">燕</text>
  <rect x="356" y="196" width="56" height="4" rx="2" fill="#e0492c"/>
  <text x="354" y="244" font-family="'Segoe UI Variable Text','Segoe UI',sans-serif" font-size="30" fill="#f3ecdf" fill-opacity="0.82">A very fast file browser for Windows</text>
</svg>
